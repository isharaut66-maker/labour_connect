<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | Labour Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#F97316',
                        'primary-hover': '#EA580C',
                        dark: '#1F2937',
                        light: '#F9FAFB',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F3F4F6;
            background-image: radial-gradient(#E5E7EB 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .auth-panel {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }
        .input-clean {
            background: #FFFFFF;
            border: 1px solid #D1D5DB;
            color: #1F2937;
            transition: all 0.2s ease;
        }
        .input-clean:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            outline: none;
        }
        .role-card {
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            transition: all 0.2s ease;
        }
        .role-card.selected {
            background: #EFF6FF;
            border-color: #3B82F6;
        }
        .role-card.selected i, .role-card.selected div {
            color: #2563EB;
        }
    </style>
</head>
<body class="text-gray-600 font-sans min-h-screen flex items-center justify-center p-4 relative">

    <!-- Auth Container -->
    <div class="auth-panel w-full max-w-md rounded-2xl p-8 z-10 relative">
        
        <!-- Back to Home -->
        <a href="index.html" class="absolute top-6 left-6 text-gray-400 hover:text-gray-900 transition-colors">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div class="text-center mb-8 mt-2">
            <div class="w-12 h-12 rounded-lg bg-primary flex items-center justify-center text-white shadow-md mx-auto mb-4">
                <i class="fa-solid fa-toolbox text-xl"></i>
            </div>
            <h2 id="authTitle" class="text-2xl font-bold text-gray-900 tracking-tight">Welcome Back</h2>
            <p id="authSubtitle" class="text-gray-500 text-sm mt-1">Sign in to your account</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="login(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" name="email" class="input-clean w-full rounded-xl px-4 py-3 text-sm placeholder-gray-400" required placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Password</label>
                <input type="password" name="password" class="input-clean w-full rounded-xl px-4 py-3 text-sm placeholder-gray-400" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="w-full bg-primary hover:bg-primary-hover text-white rounded-xl py-3.5 font-bold transition-all shadow-md hover:shadow-lg mt-2">
                Log In
            </button>
            
            <div class="text-center mt-6 text-sm text-gray-500">
                Don't have an account? 
                <a onclick="toggleAuthForm('register')" class="text-primary font-semibold hover:text-primary-hover cursor-pointer transition-colors">Sign up</a>
            </div>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="hidden space-y-5" onsubmit="register(event)">
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">I am a...</label>
                <div class="grid grid-cols-3 gap-3">
                    <div class="role-card selected rounded-xl p-3 text-center cursor-pointer" data-role="CLIENT" onclick="selectRole(this)">
                        <i class="fa-solid fa-user-tie text-lg text-gray-400 mb-1 block"></i>
                        <div class="text-xs font-semibold text-gray-600">Client</div>
                    </div>
                    <div class="role-card rounded-xl p-3 text-center cursor-pointer" data-role="LABOURER" onclick="selectRole(this)">
                        <i class="fa-solid fa-wrench text-lg text-gray-400 mb-1 block"></i>
                        <div class="text-xs font-semibold text-gray-600">Pro</div>
                    </div>
                    <div class="role-card rounded-xl p-3 text-center cursor-pointer" data-role="CONTRACTOR" onclick="selectRole(this)">
                        <i class="fa-solid fa-building text-lg text-gray-400 mb-1 block"></i>
                        <div class="text-xs font-semibold text-gray-600">Agency</div>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Full Name</label>
                <input type="text" name="name" class="input-clean w-full rounded-xl px-4 py-3 text-sm placeholder-gray-400" required placeholder="John Doe">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Email</label>
                <input type="email" name="email" class="input-clean w-full rounded-xl px-4 py-3 text-sm placeholder-gray-400" required placeholder="john@example.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Mobile</label>
                <input type="text" name="mobile" class="input-clean w-full rounded-xl px-4 py-3 text-sm placeholder-gray-400" required placeholder="9876543210">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" name="password" class="input-clean w-full rounded-xl px-4 py-3 text-sm placeholder-gray-400" required minlength="6" placeholder="Min 6 chars">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Confirm</label>
                    <input type="password" name="confirmPassword" class="input-clean w-full rounded-xl px-4 py-3 text-sm placeholder-gray-400" required placeholder="Repeat">
                </div>
            </div>

            <button type="submit" class="w-full bg-primary hover:bg-primary-hover text-white rounded-xl py-3.5 font-bold transition-all shadow-md hover:shadow-lg mt-2">
                Create Account
            </button>
            
            <div class="text-center mt-6 text-sm text-gray-500">
                Already have an account? 
                <a onclick="toggleAuthForm('login')" class="text-primary font-semibold hover:text-primary-hover cursor-pointer transition-colors">Log in</a>
            </div>
        </form>
    </div>

    <!-- Existing JS intact -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (window.location.search.includes('register=true')) {
            toggleAuthForm('register');
        }

        // Override toggleAuthForm slightly to update subtitles
        const originalToggle = toggleAuthForm;
        toggleAuthForm = function(type) {
            originalToggle(type);
            if (type === 'register') {
                document.getElementById('authSubtitle').innerText = 'Join our professional network';
            } else {
                document.getElementById('authSubtitle').innerText = 'Sign in to your account';
            }
        };
    </script>
</body>
</html>
