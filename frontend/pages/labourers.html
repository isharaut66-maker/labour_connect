<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Professionals | Labour Connect</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#F97316',
                        secondary: '#2563EB',
                        dark: '#1F2937',
                        light: '#F9FAFB',
                    }
                }
            }
        }
    </script>
    <style>
        .sidebar { transition: transform 0.3s ease; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
        }
        .side-link { transition: all 0.2s ease; }
        .side-link.active, .side-link:hover {
            background: #EFF6FF;
            color: #2563EB;
            border-right: 3px solid #2563EB;
        }
        .search-panel {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .profile-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            transition: all 0.3s ease;
        }
        .profile-card:hover {
            transform: translateY(-4px);
            border-color: #2563EB;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .input-clean {
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            color: #1F2937;
            transition: border-color 0.2s;
        }
        .input-clean:focus {
            border-color: #2563EB;
            background: #FFFFFF;
            outline: none;
        }
    </style>
</head>
<body class="bg-light text-gray-700 font-sans antialiased">

    <!-- Mobile Header -->
    <div class="md:hidden flex items-center justify-between p-4 border-b border-gray-200 bg-white sticky top-0 z-40">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-white">
                <i class="fa-solid fa-toolbox text-sm"></i>
            </div>
            <span class="font-bold text-gray-900">Labour<span class="text-primary">Connect</span></span>
        </div>
        <button onclick="document.getElementById('sidebar').classList.toggle('open')" class="text-gray-600 text-xl">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar fixed md:relative w-64 h-full bg-white border-r border-gray-200 z-50 flex flex-col shadow-xl md:shadow-none">
            <div class="p-6 hidden md:flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-toolbox"></i>
                </div>
                <span class="text-xl font-bold text-gray-900">Labour<span class="text-primary">Connect</span></span>
            </div>

            <nav class="flex-1 px-4 mt-8 overflow-y-auto space-y-1">
                <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 px-3">Menu</div>
                
                <button class="side-link w-full flex items-center gap-3 px-3 py-3 rounded-lg text-gray-600 font-semibold text-sm mb-1" onclick="window.location.href='dashboard.html'">
                    <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
                </button>
                
                <button class="side-link active w-full flex items-center gap-3 px-3 py-3 rounded-lg text-gray-600 font-semibold text-sm" onclick="window.location.href='labourers.html'">
                    <i class="fa-solid fa-magnifying-glass w-5 text-center"></i> Find Professionals
                </button>
                <button class="side-link w-full flex items-center gap-3 px-3 py-3 rounded-lg text-gray-600 font-semibold text-sm" onclick="window.location.href='projects.html'">
                    <i class="fa-solid fa-clipboard-list w-5 text-center"></i> My Projects
                </button>

                <div class="mt-6">
                    <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 px-3">Settings</div>
                    <button class="side-link w-full flex items-center gap-3 px-3 py-3 rounded-lg text-gray-600 font-semibold text-sm" onclick="window.location.href='profile.html'">
                        <i class="fa-solid fa-user w-5 text-center"></i> My Profile
                    </button>
                </div>
            </nav>

            <div class="p-4 mt-auto">
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-red-50 text-red-600 font-bold hover:bg-red-100 transition-colors border border-red-100">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 h-full overflow-y-auto bg-light p-4 md:p-8">
            
            <div class="max-w-6xl mx-auto">
                <header class="mb-8">
                    <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-2">Find Professionals</h1>
                    <p class="text-gray-500 text-sm">Discover and hire top-rated tradespeople for your project.</p>
                </header>

                <!-- Search Bar -->
                <div class="search-panel rounded-2xl p-4 md:p-6 mb-10 flex flex-col md:flex-row gap-4">
                    <div class="flex-1 relative">
                        <i class="fa-solid fa-wrench absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="searchSkill" placeholder="Search by service (e.g. Electrician, Painter)" class="input-clean w-full rounded-xl pl-12 pr-4 py-3 text-sm">
                    </div>
                    <div class="flex-1 relative">
                        <i class="fa-solid fa-location-dot absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="searchLocation" placeholder="Location (e.g. Pune, Mumbai)" class="input-clean w-full rounded-xl pl-12 pr-4 py-3 text-sm">
                    </div>
                    <button class="bg-primary hover:bg-primary-hover text-white px-8 py-3 rounded-xl font-bold transition-all shadow-md whitespace-nowrap" onclick="searchLabourers()">
                        <i class="fa-solid fa-search mr-2"></i> Search
                    </button>
                </div>

                <!-- Labourers Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="labourersGrid">
                    <!-- Loading state -->
                    <div class="col-span-full text-center py-12 text-gray-400">
                        <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-primary"></i>
                        <p>Loading profiles...</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const user = await requireAuth();
            if (!user) return;
            searchLabourers();
        });

        async function searchLabourers() {
            const skill = document.getElementById('searchSkill').value;
            const location = document.getElementById('searchLocation').value;
            
            let url = '/labourers?';
            if (skill) url += `skill=${encodeURIComponent(skill)}&`;
            if (location) url += `location=${encodeURIComponent(location)}`;
            
            try {
                const profiles = await apiRequest(url);
                renderLabourers(profiles);
            } catch (error) {
                console.error(error);
            }
        }

        function renderLabourers(profiles) {
            const grid = document.getElementById('labourersGrid');
            grid.innerHTML = '';
            
            if (profiles.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 bg-white rounded-2xl border border-gray-200"><i class="fa-solid fa-user-slash text-4xl text-gray-300 mb-4"></i><p class="text-gray-500 font-medium">No professionals found matching your criteria.</p></div>';
                return;
            }
            
            profiles.forEach(p => {
                const score = Math.min(100, (p.rating * 10) + (p.experience * 2) + 20);
                
                const card = document.createElement('div');
                card.className = 'profile-card p-6 rounded-2xl flex flex-col h-full relative overflow-hidden group';
                
                const highlightColor = score >= 90 ? 'bg-emerald-500' : (score >= 70 ? 'bg-blue-500' : 'bg-orange-500');
                
                card.innerHTML = `
                    <div class="absolute top-0 left-0 w-full h-1 ${highlightColor}"></div>
                    
                    <div class="flex gap-4 items-start mb-6">
                        <div class="relative">
                            <img src="https://i.pravatar.cc/150?u=${p.user.id}" alt="${p.user.name}" class="w-16 h-16 rounded-full object-cover border border-gray-200 shadow-sm group-hover:border-primary transition-colors">
                            <div class="absolute -bottom-1 -right-1 bg-emerald-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white shadow-sm" title="Verified Pro">
                                <i class="fa-solid fa-check"></i>
                            </div>
                        </div>
                        <div class="flex-1">
                            <h3 class="text-lg font-bold text-gray-900 leading-tight">${p.user.name}</h3>
                            <p class="text-primary font-bold text-sm mt-0.5 uppercase tracking-wide">${p.skill}</p>
                            <div class="flex items-center gap-1 mt-2">
                                <i class="fa-solid fa-star text-orange-400 text-xs"></i>
                                <span class="text-sm font-bold text-gray-700">${p.rating}</span>
                                <span class="text-xs text-gray-400 ml-1">(24 reviews)</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="inline-flex items-center justify-center px-2 py-1 rounded-lg bg-gray-50 border border-gray-200 text-gray-600 text-xs font-bold whitespace-nowrap shadow-sm">
                                ${Math.round(score)}% Match
                            </div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mb-6 flex-1">
                        <div class="bg-gray-50 rounded-xl p-3 border border-gray-100">
                            <div class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1"><i class="fa-solid fa-location-dot mr-1"></i> Location</div>
                            <div class="text-sm font-semibold text-gray-700 truncate">${p.location}</div>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-3 border border-gray-100">
                            <div class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1"><i class="fa-solid fa-indian-rupee-sign mr-1"></i> Daily Rate</div>
                            <div class="text-sm font-semibold text-gray-700">₹${p.dailyRate}</div>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-3 border border-gray-100 col-span-2">
                            <div class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1"><i class="fa-solid fa-briefcase mr-1"></i> Experience</div>
                            <div class="text-sm font-semibold text-gray-700">${p.experience} Years active</div>
                        </div>
                    </div>
                    
                    <button class="w-full bg-white hover:bg-primary text-primary hover:text-white border border-primary py-2.5 rounded-xl font-bold transition-all" onclick="alert('In a real app, this would open the booking modal for ${p.user.name}')">
                        Book Professional
                    </button>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
